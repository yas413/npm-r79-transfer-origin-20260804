name: GH-R79 repository-transfer publisher

on:
  workflow_dispatch:
    inputs:
      version:
        description: Owned canary version
        required: true
      marker:
        description: Owned canary marker
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Show bounded OIDC identity claims
        shell: bash
        run: |
          response="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          token="$(printf '%s' "$response" | jq -r .value)"
          payload="$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4; if(l==2)printf "%s==",$0; else if(l==3)printf "%s=",$0; else printf "%s",$0}' | base64 -d)"
          printf '%s' "$payload" | jq '{repository,repository_id,repository_owner,repository_owner_id,workflow,workflow_ref,actor,actor_id,sub,aud,ref,sha}'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate owned canary package
        env:
          VERSION: ${{ inputs.version }}
          MARKER: ${{ inputs.marker }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          jq -n --arg version "$VERSION" --arg repository "$CURRENT_REPOSITORY" '{
            name:"@jemz413r70a83/r70canary",
            version:$version,
            description:"Owned GH-R79 repository-transfer trust canary",
            license:"MIT",
            repository:{type:"git",url:("git+https://github.com/" + $repository + ".git")},
            files:["index.js"],
            publishConfig:{access:"public",provenance:false}
          }' > package.json
          printf 'module.exports = %s;\n' "$(jq -Rn --arg marker "$MARKER" '$marker')" > index.js
          npm install --global npm@11.16.0

      - name: Publish owned canary
        run: npm publish --access public --provenance=false
